palette = "noctalia"
format = """$username$hostname$directory$git_branch$git_status$fill$time$line_break$character"""


[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"

[fill]
symbol = " "

[time]
style = "green"
time_format = "%R"
format = '[$time]($style)'
disabled = false

[git_commit]
tag_symbol = " tag "

[git_status]
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

